name: Validate Invictus Website
on:
  push:
    branches: [main, feature/redesign-profissional-react]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate static pages
        run: npm run check
